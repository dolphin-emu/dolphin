name: NVDEMU macOS Release

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: nvdemu-macos-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  MACOSX_DEPLOYMENT_TARGET: "12.0"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  build:
    name: Build macOS ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install tools
        run: |
          brew install cmake qt ccache
          cmake --version
          ccache --version

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: nvdemu-macos-${{ matrix.arch }}-ccache-v2
          restore-keys: |
            nvdemu-macos-${{ matrix.arch }}-ccache-

      - name: Configure ccache
        run: |
          ccache --set-config=cache_dir="$HOME/.ccache"
          ccache --set-config=max_size=4G
          ccache --set-config=compiler_check=content

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPOSTPROCESS_BUNDLE=ON \
            -DENABLE_AUTOUPDATE=ON \
            -DENABLE_ANALYTICS=OFF \
            -DENABLE_TESTS=OFF \
            -DUSE_SYSTEM_LIBS=OFF \
            -DDISTRIBUTOR=NVDEMU

      - name: Build
        run: |
          cmake --build build --target dolphin-emu --parallel 4
          test -x build/Binaries/Dolphin.app/Contents/MacOS/Dolphin

      - name: Verify architecture
        run: |
          file build/Binaries/Dolphin.app/Contents/MacOS/Dolphin
          test "$(lipo -archs build/Binaries/Dolphin.app/Contents/MacOS/Dolphin)" = "${{ matrix.arch }}"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: nvdemu-dolphin-${{ matrix.arch }}
          path: build/Binaries/Dolphin.app
          if-no-files-found: error
          retention-days: 3

  release:
    name: Package and release universal macOS build
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download arm64
        uses: actions/download-artifact@v4
        with:
          name: nvdemu-dolphin-arm64
          path: apps/arm64

      - name: Download Intel
        uses: actions/download-artifact@v4
        with:
          name: nvdemu-dolphin-x86_64
          path: apps/x86_64

      - name: Merge universal app
        run: |
          rm -rf universal
          python3 - <<'PY'
          from BuildMacOSUniversalBinary import recursive_merge_binaries
          recursive_merge_binaries(
              "apps/arm64/Dolphin.app",
              "apps/x86_64/Dolphin.app",
              "universal/Dolphin.app",
          )
          PY
          test -x universal/Dolphin.app/Contents/MacOS/Dolphin

      - name: Sign and verify
        run: |
          codesign --force --deep --sign - universal/Dolphin.app
          codesign --verify --deep --strict universal/Dolphin.app
          lipo -info universal/Dolphin.app/Contents/MacOS/Dolphin
          ARCHS="$(lipo -archs universal/Dolphin.app/Contents/MacOS/Dolphin)"
          test "$ARCHS" = "x86_64 arm64" || test "$ARCHS" = "arm64 x86_64"

      - name: Create DMG
        run: |
          rm -rf dmg-root release
          mkdir -p dmg-root release
          ditto universal/Dolphin.app dmg-root/Dolphin.app
          ln -s /Applications dmg-root/Applications
          printf '%s\n' \
            'NVDEMU Dolphin macOS Universal' \
            '' \
            'Drag Dolphin.app to Applications.' \
            'This build is ad-hoc signed and is not Apple notarized.' \
            > dmg-root/README.txt
          hdiutil create \
            -volname "NVDEMU Dolphin" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            release/Dolphin-NVDEMU-macOS-universal.dmg
          shasum -a 256 release/Dolphin-NVDEMU-macOS-universal.dmg \
            > release/Dolphin-NVDEMU-macOS-universal.dmg.sha256
          test -s release/Dolphin-NVDEMU-macOS-universal.dmg

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="nvdemu-macos-$GITHUB_SHA"
          TITLE="NVDEMU Dolphin macOS Universal $GITHUB_SHA"
          gh release create "$TAG" \
            release/Dolphin-NVDEMU-macOS-universal.dmg \
            release/Dolphin-NVDEMU-macOS-universal.dmg.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "Universal macOS 12+ build for Apple Silicon and Intel."
