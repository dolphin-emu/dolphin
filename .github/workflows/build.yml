name: Build Dolphin Custom SWBF3
on: [workflow_dispatch]

jobs:
  build:
      runs-on: ubuntu-latest
          steps:
                - name: Ambil Sumber Resmi Dolphin Terbaru
                        uses: actions/checkout@v4
                                with:
                                          fetch-depth: 0

                                                - name: Siapkan Sistem Java SDK 17
                                                        uses: actions/setup-java@v4
                                                                with:
                                                                          java-version: '17'
                                                                                    distribution: 'temurin'

                                                                                          - name: Paksa Masuk Perbaikan Vertex PR 13227
                                                                                                  run: |
                                                                                                            git config --global user.name "Fauzan Romadhon"
                                                                                                                      git config --global user.email "fauzanromadhon735@gmail.com"
                                                                                                                                git fetch origin pull/13227/head:pr13227
                                                                                                                                          git merge pr13227 --no-edit

                                                                                                                                                - name: Build APK Menggunakan SDK Internal Android
                                                                                                                                                        run: |
                                                                                                                                                                  cd Source/Android
                                                                                                                                                                            chmod +x gradlew
                                                                                                                                                                                      ./gradlew assembleDebug

                                                                                                                                                                                            - name: Simpan Hasil APK
                                                                                                                                                                                                    uses: actions/upload-artifact@v4
                                                                                                                                                                                                            with:
                                                                                                                                                                                                                      name: Dolphin-SWBF3-PR13227
                                                                                                                                                                                                                                path: Source/Android/app/build/outputs/apk/debug/app-debug.apk
