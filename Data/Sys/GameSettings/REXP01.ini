# REXP01 - Excite Truck

[OnFrame]
# The game's logic runs at a fixed rate of 60 FPS. In the main idle loop, the
# game continuously checks how many physics steps to take depending on time
# passed. The steps are processed within the loop, which only exits if at least
# one step has been processed (the rendering routines are outside the loop).
#
# The complexity of this prevents Dolphin from idling, meaning that if the
# emulated CPU is overclocked more than necessary for the current scene
# (overclock is needed to run the game at a stable 60 FPS), the emulation
# performance is going to be worse.
#
# (Note: during the slow-mo car crash animation, the check is performed only
# once so that the game can render interpolated frames at an uncapped speed,
# which is even worse to emulate.)
#
# The first line adds a call to `VIWaitForRetrace` (after `GXSetDrawDone`) so
# that Dolphin can idle.
#
# However, because the wait for the physics update is completely unrelated to
# the vblanks, the game will wait even *after* `VIWaitForRetrace` (until one
# frame of lag happens: then there will always be at least one physics step to
# do afterwards).
# Thus, the second line makes the idle loop iterate only once.
# (This is pointless with the `Force interpolated rendering` cheat code since it
# already does this, but it doesn't hurt either.)
#
# The main reason why this speed hack isn't enabled by default is that it limits
# the frame rate to a dividend of the vblank rate. Due to how demanding this
# game is on the Wii's CPU with default clock settings, the speed hack will make
# the game constantly jump between 60 and 30 FPS during a race. Thus, the wiki
# explains that the speed hack is meant to be used with an overclocked emulated
# CPU.
$Speed hack (see wiki)
0x802D2D00:dword:0x4BD87228
0x80177FBC:dword:0x60000000

[Gecko]
$Force interpolated rendering (>60 FPS with VBI Frequency Override)
20577DF8 00000001 # If the game is supposed to run at normal speed...
04577DF8 00000002 # ...force slow motion mode (allows interpolated rendering)
04577DFC 3F800000 # ...and set slow motion speed 1.0 (that is, normal speed, the game already sets 3.0 when the car crashes)
E0000000 80008000
*Forces the game's native frame interpolation to render at any frame rate when using VBI Frequency Override.
*Only enable if aiming to play at higher than 60 FPS, as it will cause jittering otherwise.
*Recommended to use with the speed hack patch.

