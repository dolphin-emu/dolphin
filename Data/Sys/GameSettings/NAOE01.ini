# NAOE01 - 1080° Snowboarding

[OnFrame]
# The Virtual Console for this game has aggressive self-modifying code, resulting
# in poor JIT performance. This patch changes functionality of some of the MIPS
# translating and managing functions, resulting in less instruction invalidation
# needed, and fixing a hang during fadeouts.
