# REXE01, REXP01, REXJ01 - Excite Truck

[Video_Hacks]
# Required for correct tree lighting.
# Tree lighting is CPU-sampled from the same texture used for terrain shadowing (which is rendered in real time).
EFBToTextureEnable = False
# If a user needs `EFBToTextureEnable = True` for performance reasons, it's better to have the trees always completely lit rather than pitch black.
EFBToTextureClearByte = 255
# Needed to properly display car shadows in 2-players split-screen, otherwise, P1's shadows are the same as P2's.
# (DeferEFBCopies = False would also fix it, but it severely impacts performance and shadows don't scale with the resolution.)
AllowIncorrectEFBSizeVRAM = True
