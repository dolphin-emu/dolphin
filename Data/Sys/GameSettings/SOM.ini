# SOMJ01, SOME01, SOMP01, SOMK01 - Rhythm Heaven Fever

[Video_Hacks]
# Prevent black flickering in some minigames (e.g. Micro-Row tutorial, Shrimp Shuffle).
ImmediateXFBEnable = False
# Prevent frozen frame in Micro-Row after tutorial.
# This is because during the transition, the CPU clears a EFB texture to 0 and doesn't use it as an EFB copy target anymore, but the game continues to read it and expecting it to be all 0.
# With `EFBToTextureClearByte = 0`, the texture in RAM doesn't change after the CPU clear, thus Dolphin doesn't invalidate it and returns the stale texture in VRAM.
# By clearing with anything else, Dolphin can notice the change of the texture and invalidate it, with no need for `EFBToTextureEnable = False`.
EFBToTextureClearByte = 255
