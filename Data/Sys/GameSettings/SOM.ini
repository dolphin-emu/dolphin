# SOMJ01, SOME01, SOMP01, SOMK01 - Rhythm Heaven Fever

[Video_Hacks]
# Prevent black flickering in some minigames (e.g. Micro-Row tutorial, Shrimp Shuffle).
ImmediateXFBEnable = False
# Prevent frozen frame in Micro-Row after tutorial.
# During the transition, the CPU clears an EFB texture to 0 and does not use it as an EFB copy target anymore, but the game continues to read it and expects it to be all 0.
# With EFBToTextureClearByte = 0, the texture in RAM does not change after the CPU clear, so Dolphin does not invalidate the stale texture in VRAM.
# By clearing with anything else, Dolphin can notice the change and invalidate it, with no need for EFBToTextureEnable = False.
EFBToTextureClearByte = 255
